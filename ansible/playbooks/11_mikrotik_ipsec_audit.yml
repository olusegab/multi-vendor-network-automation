---
- name: Read the IPsec and NAT configuration (read-only)
  hosts: apo-mikrotik
  gather_facts: false

  tasks:
    - name: Collect the router's tunnel-related configuration
      community.routeros.command:
        commands:
          - /system resource print
          - /ip address print without-paging
          - /ip ipsec peer print without-paging
          - /ip ipsec proposal print without-paging
          - /ip ipsec policy print detail without-paging
          - /ip firewall nat print without-paging
      register: audit
      changed_when: false

    - name: Show it
      ansible.builtin.debug:
        var: audit.stdout_lines