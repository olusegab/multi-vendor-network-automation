---
- name: Create the AWS IPsec tunnel on the HQ Sophos firewall
  hosts: sophos
  gather_facts: false

  vars:
    aws_region: "us-east-1"
    aws_tunnel_number: 1
    tunnel_name: "AWS_VPN_{{ aws_tunnel_number }}"
    tunnel_address: "{{ aws['tunnel' ~ aws_tunnel_number ~ '_address'].value }}"
    tunnel_psk: "{{ aws['tunnel' ~ aws_tunnel_number ~ '_preshared_key'].value }}"
    ipsec_profile: "IKEv2"
    hide_secrets: true

  pre_tasks:
    - name: Load the Terraform outputs
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars/aws_vpn.json"
        name: aws

    - name: Load local settings
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars/local.yml"

    - name: Stop early if a required value is missing
      ansible.builtin.assert:
        that:
          - "(aws.get('tunnel' ~ aws_tunnel_number ~ '_address', {}).get('value') or '') | length > 0"
          - "(aws.get('tunnel' ~ aws_tunnel_number ~ '_preshared_key', {}).get('value') or '') | length > 0"
          - "(aws.get('vpn_connection_id', {}).get('value') or '') | length > 0"
          - sophos_wan_ip is defined
          - wan_interface is defined
        fail_msg: "Missing a Terraform output or a local setting. Is the AWS VPN applied?"

    - name: Check the VPN in the Terraform outputs still exists
      amazon.aws.ec2_vpc_vpn_info:
        region: "{{ aws_region }}"
        vpn_connection_ids:
          - "{{ aws.vpn_connection_id.value }}"
      delegate_to: localhost
      register: vpn_check

    - name: Stop if the VPN is deleted or missing
      ansible.builtin.assert:
        that:
          - vpn_check.vpn_connections | length > 0
          - vpn_check.vpn_connections[0].state in ['available', 'pending']
        fail_msg: >-
          VPN {{ aws.vpn_connection_id.value }} is deleted or missing.
          Run terraform apply, re-export aws_vpn.json and copy it over.

  tasks:
    - name: Remove the old connection (only with -e recreate=true)
      sophos.sophos_firewall.sfos_ipsec_connection:
        name: "{{ tunnel_name }}"
        state: absent
      when: recreate | default(false) | bool

    - name: Look for an existing connection with this name (read only)
      sophos.sophos_firewall.sfos_ipsec_connection:
        name: "{{ tunnel_name }}"
        state: query
      register: existing

    - name: Create the tunnel-interface connection
      sophos.sophos_firewall.sfos_ipsec_connection:
        name: "{{ tunnel_name }}"
        state: present
        description: "AWS Site-to-Site VPN tunnel {{ aws_tunnel_number }} (managed by Ansible)"
        connection_type: TunnelInterface
        gateway_type: Initiate
        profile: "{{ ipsec_profile }}"
        authentication_type: PresharedKey
        preshared_key: "{{ tunnel_psk }}"
        listening_interface: "{{ wan_interface }}"
        gateway_address: "{{ tunnel_address }}"
        local_id_type: "IP Address"
        local_id: "{{ sophos_wan_ip }}"
        remote_id_type: "IP Address"
        remote_id: "{{ tunnel_address }}"
        allow_nat_traversal: Disable
      when: existing.api_response.Response.VPNIPSecConnection.Configuration.Status is defined
      register: created
      no_log: "{{ hide_secrets }}"

    - name: Activate and start the connection
      sophos.sophos_firewall.sfos_ipsec_connection:
        name: "{{ tunnel_name }}"
        state: updated
        active: true
        connection: true
      when: created is changed

    - name: Wait for AWS to report this tunnel as UP
      amazon.aws.ec2_vpc_vpn_info:
        region: "{{ aws_region }}"
        vpn_connection_ids:
          - "{{ aws.vpn_connection_id.value }}"
      delegate_to: localhost
      register: vpn
      vars:
        this_tunnel: >-
          {{ vpn.vpn_connections[0].vgw_telemetry
             | selectattr('outside_ip_address', 'equalto', tunnel_address)
             | list }}
      until: this_tunnel | length > 0 and this_tunnel[0].status == 'UP'
      retries: 12
      delay: 10

    - name: Show tunnel status
      ansible.builtin.debug:
        msg: "{{ tunnel_name }} ({{ tunnel_address }}) is {{ this_tunnel[0].status }} - {{ this_tunnel[0].status_message | default('') }}"
      vars:
        this_tunnel: >-
          {{ vpn.vpn_connections[0].vgw_telemetry
             | selectattr('outside_ip_address', 'equalto', tunnel_address)
             | list }}
